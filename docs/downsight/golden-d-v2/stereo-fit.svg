<text x="898" y="68.8" fill="#269bff">正向运动学：左相机坐标中的三</text>
<text x="898" y="88.8" fill="#269bff">维关节</text>
</g>
<g id="A"><rect x="89" y="200" width="335" height="76" rx="21" fill="#e5f2ff" stroke="#d8dfe5" stroke-width="1.5"/>
