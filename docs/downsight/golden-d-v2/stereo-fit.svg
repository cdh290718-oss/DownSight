</g>
<g id="L"><rect x="528" y="196" width="182" height="76" rx="21" fill="#e5f2ff" stroke="#d8dfe5" stroke-width="1.5"/>
<text x="619" y="239.8" fill="#269bff">左鱼眼投影</text>
</g>
<g id="R"><rect x="761" y="192" width="342" height="84" rx="21" fill="#e5f2ff" stroke="#d8dfe5" stroke-width="1.5"/>
